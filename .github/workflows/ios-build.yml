name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - app-store

env:
  APP_ID: dk.ostjylland.lystfiskerguide
  APP_NAME: Østjylland Lystfisker

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app for Capacitor
        run: npm run build:static
        env:
          CAPACITOR_BUILD: 'true'

      - name: Generate app icons
        run: npm run icons:create

      - name: Add iOS platform
        run: npx cap add ios || true

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # For development builds (no signing)
      - name: Build iOS (Development)
        if: ${{ github.event.inputs.build_type == 'development' }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build

      # For App Store builds (requires certificates)
      - name: Install Apple Certificate
        if: ${{ github.event.inputs.build_type == 'app-store' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        if: ${{ github.event.inputs.build_type == 'app-store' }}
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: ${{ env.APP_ID }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Build iOS (App Store)
        if: ${{ github.event.inputs.build_type == 'app-store' }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive

      - name: Export IPA
        if: ${{ github.event.inputs.build_type == 'app-store' }}
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ../../ios-export-options.plist \
            -exportPath build/

      - name: Upload IPA artifact
        if: ${{ github.event.inputs.build_type == 'app-store' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-store-ipa
          path: ios/App/build/*.ipa

      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.build_type == 'app-store' }}
        run: |
          xcrun altool --upload-app \
            -f ios/App/build/*.ipa \
            -t ios \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
