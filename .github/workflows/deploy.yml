name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Sync spots data
        run: npm run sync:spots

      - name: Build static site
        env:
          VITE_STATIC_MODE: true
          NODE_ENV: production
        run: npx vite build --outDir dist-static

      - name: Copy public files
        run: |
          cp client/public/.nojekyll client/dist-static/
          cp client/public/404.html client/dist-static/
          if [ -d "uploads" ]; then
            cp -r uploads client/dist-static/uploads
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist-static
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy
    # E2E tests can be cancelled if a new deploy starts
    concurrency:
      group: e2e-tests
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against deployed site
        continue-on-error: true
        run: npx playwright test --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://kloppnr1.github.io/eastjutland-fishing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
