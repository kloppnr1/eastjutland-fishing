<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects all 404s to index.html with the path preserved
      const path = window.location.pathname;
      const repo = '/eastjutland-fishing';
      if (path.startsWith(repo)) {
        const route = path.slice(repo.length) || '/';
        sessionStorage.setItem('redirect', route + window.location.search);
      }
      window.location.replace(repo + '/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
