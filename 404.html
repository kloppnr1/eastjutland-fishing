<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname;
      var base = '/eastjutland-fishing';
      if (path.startsWith(base)) {
        var route = path.slice(base.length) || '/';
        sessionStorage.setItem('redirect', route + window.location.search);
      }
      window.location.replace(base + '/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
