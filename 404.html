<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects all 404s to index.html with the path preserved
      sessionStorage.setItem('redirect', window.location.pathname + window.location.search);
      window.location.replace('/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
